<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アメニティ・タオル自動計算ツール</title>
<style>
  :root{
    --sand:#F6F3EC;
    --ink:#2B3A3A;
    --sea:#3E6E6E;
    --sea-deep:#294B4B;
    --coral:#D98868;
    --line:#DEDACD;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--sand);
    color:var(--ink);
    font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    line-height:1.6;
    padding:24px 14px 56px;
  }
  .wrap{max-width:560px;margin:0 auto;}
  h1{
    font-size:20px;
    font-weight:700;
    letter-spacing:.02em;
    margin:0 0 4px;
    color:var(--sea-deep);
  }
  .sub{
    color:#6B7A7A;
    font-size:12.5px;
    margin:0 0 22px;
    border-bottom:1px solid var(--line);
    padding-bottom:18px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:18px 18px;
    margin-bottom:18px;
  }
  .field{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    gap:12px;
  }
  .field:last-child{border-bottom:none;}
  .field label{font-size:14px;color:var(--ink);}
  .field .hint{display:block;font-size:11px;color:#8A9595;margin-top:2px;}
  .field input{
    width:76px;
    flex:0 0 auto;
    text-align:center;
    padding:9px 6px;
    border:1px solid var(--line);
    border-radius:4px;
    font-size:16px;
    color:var(--sea-deep);
    background:#FBFAF7;
  }
  .field input:focus{outline:2px solid var(--sea);outline-offset:1px;}
  button{
    width:100%;
    padding:14px;
    background:var(--sea);
    color:#fff;
    border:none;
    border-radius:5px;
    font-size:15px;
    font-weight:600;
    letter-spacing:.02em;
    cursor:pointer;
    margin-top:4px;
  }
  button:active{background:var(--sea-deep);}
  #result{display:none;}
  .row{
    display:flex;
    justify-content:space-between;
    padding:9px 2px;
    font-size:15px;
    border-bottom:1px dashed var(--line);
  }
  .row:last-child{border-bottom:none;}
  .row .num{font-weight:700;color:var(--sea-deep);}
  .empty{
    font-size:13px;
    color:#8A9595;
    text-align:center;
    padding:12px 0;
  }
  .footer-note{
    text-align:center;
    font-size:11px;
    color:#9BA6A6;
    margin-top:20px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>アメニティ・タオル自動計算ツール</h1>
  <p class="sub">人数と宿泊数を入力し、「計算する」を押してください。</p>

  <div class="card">
    <div class="field">
      <div><label>大人</label><span class="hint">19歳以上</span></div>
      <input type="number" id="adults" min="0" step="1" value="0" inputmode="numeric">
    </div>
    <div class="field">
      <div><label>子供</label><span class="hint">8〜18歳</span></div>
      <input type="number" id="b818" min="0" step="1" value="0" inputmode="numeric">
    </div>
    <div class="field">
      <div><label>子供</label><span class="hint">3〜7歳</span></div>
      <input type="number" id="k37" min="0" step="1" value="0" inputmode="numeric">
    </div>
    <div class="field">
      <div><label>子供</label><span class="hint">0〜2歳</span></div>
      <input type="number" id="i02" min="0" step="1" value="0" inputmode="numeric">
    </div>
    <div class="field">
      <div><label>宿泊数</label><span class="hint">泊</span></div>
      <input type="number" id="nights" min="1" step="1" value="1" inputmode="numeric">
    </div>
  </div>

  <button onclick="calculate()">計算する</button>

  <div class="card" id="result">
    <div id="result-rows"></div>
  </div>

  <p class="footer-note">アメニティ・タオル自動計算ツール</p>
</div>

<script>
function calculate(){
  const adults = Math.max(0, parseInt(document.getElementById('adults').value) || 0);
  const b818   = Math.max(0, parseInt(document.getElementById('b818').value) || 0);
  const k37    = Math.max(0, parseInt(document.getElementById('k37').value) || 0);
  const i02    = Math.max(0, parseInt(document.getElementById('i02').value) || 0);
  const nights = Math.max(1, parseInt(document.getElementById('nights').value) || 1);

  const bigPeople = adults + b818; // 大人+8〜18歳
  const towelBase = adults + b818 + k37;

  const bathTowel  = towelBase * (2 + (nights - 1)) + i02 * (1 + (nights - 1));
  const faceTowel  = bathTowel; // 同じ式
  const toothbrush = bigPeople * nights;
  const slipper    = bigPeople;
  const bodyTowel  = bigPeople;
  const brushSet   = Math.ceil(bigPeople / 2) * nights; // ブラシ・ヘアバンド・かみそり共通
  const pajama     = bigPeople * nights;
  const kidsPajama = k37 * nights;
  const kidsAmenity= k37; // 宿泊数に関係なく人数分のみ
  const bathrobe   = adults * 1;

  const items = [
    ['バスタオル', bathTowel, 'セット'],
    ['フェイスタオル', faceTowel, 'セット'],
    ['歯ブラシ', toothbrush, '個'],
    ['スリッパ', slipper, '足'],
    ['ボディタオル', bodyTowel, '個'],
    ['ブラシ', brushSet, '個'],
    ['ヘアバンド', brushSet, '個'],
    ['かみそり', brushSet, '個'],
    ['パジャマ', pajama, '着'],
    ['キッズパジャマ', kidsPajama, '着'],
    ['キッズアメニティ', kidsAmenity, 'セット'],
    ['バスローブ', bathrobe, '着'],
  ];

  const rowsEl = document.getElementById('result-rows');
  rowsEl.innerHTML = '';

  const visible = items.filter(it => it[1] > 0);

  if (visible.length === 0){
    const div = document.createElement('div');
    div.className = 'empty';
    div.textContent = '人数を入力してください';
    rowsEl.appendChild(div);
  } else {
    visible.forEach(([name, qty, unit]) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<span>' + name + '</span><span class="num">' + qty + ' ' + unit + '</span>';
      rowsEl.appendChild(row);
    });
  }

  document.getElementById('result').style.display = 'block';
}
</script>
</body>
</html>
